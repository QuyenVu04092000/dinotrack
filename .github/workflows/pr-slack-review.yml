name: PR Slack - Notify New PR

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test"
        required: true
        default: "1"

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    permissions:
      pull-requests: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Copilot review
        id: copilot
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          REPO="${{ github.repository }}"

          PR_STATE=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.state')
          if [ "$PR_STATE" != "open" ]; then
            echo "state=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Polling for Copilot review (max 3 min)..."
          STATE=""
          for i in $(seq 1 12); do
            REVIEW=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews \
              --jq '[.[] | select(.user.login == "copilot-pull-request-reviewer")] | last')
            STATE=$(echo "$REVIEW" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('state', '') if d else '')
            " 2>/dev/null || echo "")
            if [ -n "$STATE" ]; then
              echo "Copilot reviewed: $STATE"
              break
            fi
            echo "Attempt $i/12 — waiting 15s..."
            sleep 15
          done

          echo "state=${STATE:-skip}" >> $GITHUB_OUTPUT

      - name: Get diff stats
        if: steps.copilot.outputs.state != 'skip'
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.ref || 'main' }}
          FILES=$(git diff --name-only origin/${BASE}...HEAD | wc -l | tr -d ' ')
          echo "file_count=$FILES" >> $GITHUB_OUTPUT
          git diff origin/${BASE}...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' | head -c 3000 > /tmp/diff_snippet.txt

      - name: Generate AI summary in Vietnamese
        if: steps.copilot.outputs.state != 'skip'
        id: ai_summary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, json, urllib.request

          diff = open("/tmp/diff_snippet.txt").read() or "(no diff)"
          payload = {
            "model": "llama-3.3-70b-versatile",
            "max_tokens": 512,
            "messages": [{
              "role": "user",
              "content": f"Tóm tắt ngắn gọn những thay đổi trong PR này bằng tiếng Việt (tối đa 3 câu). Diff:\n{diff}"
            }]
          }
          req = urllib.request.Request(
            "https://api.groq.com/openai/v1/chat/completions",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
              "Content-Type": "application/json"
            }
          )
          try:
            with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.load(resp)
              summary = data["choices"][0]["message"]["content"].strip()
          except Exception as e:
            print(f"Groq error: {e}", file=sys.stderr)
            summary = "Không thể tạo tóm tắt tự động."

          delimiter = "EOF_SUMMARY"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"summary<<{delimiter}\n{summary}\n{delimiter}\n")
          PYEOF

      - name: Post to Slack
        if: steps.copilot.outputs.state != 'skip'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          pr_number  = "${{ github.event.pull_request.number || inputs.pr_number }}"
          pr_title   = "${{ github.event.pull_request.title }}"
          pr_author  = "${{ github.event.pull_request.user.login }}"
          pr_branch  = "${{ github.event.pull_request.head.ref }}"
          pr_url     = "${{ github.event.pull_request.html_url }}"
          file_count    = "${{ steps.diff.outputs.file_count }}"
          ai_summary    = "${{ steps.ai_summary.outputs.summary }}"
          copilot_state = "${{ steps.copilot.outputs.state }}"

          state_label = {
            "APPROVED": "✅ Copilot approved",
            "CHANGES_REQUESTED": "🔄 Copilot yêu cầu chỉnh sửa",
            "COMMENTED": "💬 Copilot đã review và comment",
          }.get(copilot_state.upper(), f"💬 {copilot_state}")

          blocks = [
            {
              "type": "header",
              "text": {"type": "plain_text", "text": "Pull Request da duoc Copilot review — can quyet dinh merge"}
            },
            {
              "type": "section",
              "fields": [
                {"type": "mrkdwn", "text": f"*Tiêu đề:*\n{pr_title}"},
                {"type": "mrkdwn", "text": f"*Tác giả:*\n{pr_author}"},
                {"type": "mrkdwn", "text": f"*Branch:*\n{pr_branch}"},
                {"type": "mrkdwn", "text": f"*Số file thay đổi:*\n{file_count}"},
                {"type": "mrkdwn", "text": f"*Copilot review:*\n{state_label}"},
              ]
            },
            {
              "type": "section",
              "text": {"type": "mrkdwn", "text": f"*Tóm tắt AI:*\n{ai_summary}"}
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {"type": "plain_text", "text": "Xem PR"},
                  "url": pr_url,
                  "action_id": "view_pr"
                }
              ]
            },
            {
              "type": "context",
              "elements": [
                {"type": "mrkdwn", "text": f"Dùng `/approve {pr_number}` để merge hoặc `/reject {pr_number}` để từ chối"}
              ]
            }
          ]

          req = urllib.request.Request(
            "https://slack.com/api/chat.postMessage",
            data=json.dumps({"channel": os.environ["SLACK_CHANNEL_ID"], "blocks": blocks}).encode(),
            headers={
              "Authorization": f"Bearer {os.environ['SLACK_BOT_TOKEN']}",
              "Content-Type": "application/json"
            }
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
            result = json.load(resp)
            print("Slack response:", result.get("ok"), result.get("error", ""))
          PYEOF
