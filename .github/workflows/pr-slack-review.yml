name: PR Slack - Notify New PR

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test"
        required: true
        default: "1"

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    permissions:
      pull-requests: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR is still open
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          PR_STATE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.state')
          echo "pr_state=$PR_STATE" >> $GITHUB_OUTPUT

      - name: Get diff stats
        if: steps.check.outputs.pr_state == 'open'
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.ref || 'main' }}
          FILES=$(git diff --name-only origin/${BASE}...HEAD | wc -l | tr -d ' ')
          echo "file_count=$FILES" >> $GITHUB_OUTPUT
          git diff origin/${BASE}...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' | head -c 3000 > /tmp/diff_snippet.txt

      - name: Generate AI summary in Vietnamese
        if: steps.check.outputs.pr_state == 'open'
        id: ai_summary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, json, urllib.request

          diff = open("/tmp/diff_snippet.txt").read() or "(no diff)"
          payload = {
            "model": "llama-3.3-70b-versatile",
            "max_tokens": 512,
            "messages": [{
              "role": "user",
              "content": f"Tóm tắt ngắn gọn những thay đổi trong PR này bằng tiếng Việt (tối đa 3 câu). Diff:\n{diff}"
            }]
          }
          req = urllib.request.Request(
            "https://api.groq.com/openai/v1/chat/completions",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
              "Content-Type": "application/json"
            }
          )
          try:
            with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.load(resp)
              summary = data["choices"][0]["message"]["content"].strip()
          except Exception as e:
            print(f"Groq error: {e}", file=sys.stderr)
            summary = "Không thể tạo tóm tắt tự động."

          delimiter = "EOF_SUMMARY"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"summary<<{delimiter}\n{summary}\n{delimiter}\n")
          PYEOF

      - name: Post to Slack
        if: steps.check.outputs.pr_state == 'open'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          pr_number   = "${{ github.event.pull_request.number || inputs.pr_number }}"
          pr_title    = "${{ github.event.pull_request.title }}"
          pr_author   = "${{ github.event.pull_request.user.login }}"
          pr_branch   = "${{ github.event.pull_request.head.ref }}"
          pr_url      = "${{ github.event.pull_request.html_url }}"
          file_count  = "${{ steps.diff.outputs.file_count }}"
          ai_summary  = "${{ steps.ai_summary.outputs.summary }}"
          commit_sha  = "${{ github.event.pull_request.head.sha }}"[:7]
          commit_msg  = "${{ github.event.head_commit.message || github.event.pull_request.head.sha }}"
          commit_url  = "${{ github.event.pull_request.html_url }}/commits/${{ github.event.pull_request.head.sha }}"
          event_type  = "${{ github.event_name }}"
          action      = "${{ github.event.action }}"

          event_label = {
            ("pull_request", "opened"): "🆕 PR mới được tạo",
            ("pull_request", "synchronize"): "🔄 Có commit mới",
            ("pull_request", "ready_for_review"): "✅ Sẵn sàng review",
          }.get((event_type, action), "📋 PR cập nhật")

          blocks = [
            {
              "type": "header",
              "text": {"type": "plain_text", "text": "Pull Request can review"}
            },
            {
              "type": "section",
              "fields": [
                {"type": "mrkdwn", "text": f"*Tieu de:*\n<{pr_url}|{pr_title}>"},
                {"type": "mrkdwn", "text": f"*Tac gia:*\n{pr_author}"},
                {"type": "mrkdwn", "text": f"*Branch:*\n`{pr_branch}`"},
                {"type": "mrkdwn", "text": f"*So file thay doi:*\n{file_count}"},
              ]
            },
            {
              "type": "section",
              "fields": [
                {"type": "mrkdwn", "text": f"*Su kien:*\n{event_label}"},
                {"type": "mrkdwn", "text": f"*Commit:*\n<{commit_url}|`{commit_sha}`> {commit_msg.splitlines()[0][:60]}"},
              ]
            },
            {
              "type": "section",
              "text": {"type": "mrkdwn", "text": f"*Tom tat AI:*\n{ai_summary}"}
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {"type": "plain_text", "text": "Xem PR"},
                  "url": pr_url,
                  "action_id": "view_pr"
                }
              ]
            },
            {
              "type": "context",
              "elements": [
                {"type": "mrkdwn", "text": f"Dung `/approve {pr_number}` de merge hoac `/reject {pr_number}` de tu choi"}
              ]
            }
          ]

          req = urllib.request.Request(
            "https://slack.com/api/chat.postMessage",
            data=json.dumps({"channel": os.environ["SLACK_CHANNEL_ID"], "blocks": blocks}).encode(),
            headers={
              "Authorization": f"Bearer {os.environ['SLACK_BOT_TOKEN']}",
              "Content-Type": "application/json"
            }
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
            result = json.load(resp)
            print("Slack response:", result.get("ok"), result.get("error", ""))
          PYEOF
