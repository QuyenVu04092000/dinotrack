name: PR Slack - Copilot Review Done

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    if: github.event.review.user.login == 'copilot-pull-request-reviewer'
    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          pr_number    = "${{ github.event.pull_request.number }}"
          pr_title     = "${{ github.event.pull_request.title }}"
          pr_author    = "${{ github.event.pull_request.user.login }}"
          pr_branch    = "${{ github.event.pull_request.head.ref }}"
          pr_url       = "${{ github.event.pull_request.html_url }}"
          review_state = "${{ github.event.review.state }}"
          review_url   = "${{ github.event.review.html_url }}"

          state_label = {
            "approved": "✅ Approved",
            "changes_requested": "🔄 Yêu cầu chỉnh sửa",
            "commented": "💬 Đã review và comment",
          }.get(review_state.lower(), f"💬 {review_state}")

          blocks = [
            {
              "type": "header",
              "text": {"type": "plain_text", "text": "✅ Copilot đã review xong — sẵn sàng quyết định merge"}
            },
            {
              "type": "section",
              "fields": [
                {"type": "mrkdwn", "text": f"*Tiêu đề:*\n{pr_title}"},
                {"type": "mrkdwn", "text": f"*Tác giả:*\n{pr_author}"},
                {"type": "mrkdwn", "text": f"*Branch:*\n{pr_branch}"},
                {"type": "mrkdwn", "text": f"*Copilot review:*\n{state_label}"},
              ]
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {"type": "plain_text", "text": "Xem PR"},
                  "url": pr_url,
                  "action_id": "view_pr"
                },
                {
                  "type": "button",
                  "text": {"type": "plain_text", "text": "Xem review"},
                  "url": review_url,
                  "action_id": "view_review"
                }
              ]
            },
            {
              "type": "context",
              "elements": [
                {"type": "mrkdwn", "text": f"Dùng `/approve {pr_number}` để merge hoặc `/reject {pr_number}` để từ chối"}
              ]
            }
          ]

          req = urllib.request.Request(
            "https://slack.com/api/chat.postMessage",
            data=json.dumps({"channel": os.environ["SLACK_CHANNEL_ID"], "blocks": blocks}).encode(),
            headers={
              "Authorization": f"Bearer {os.environ['SLACK_BOT_TOKEN']}",
              "Content-Type": "application/json"
            }
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
            result = json.load(resp)
            print("Slack response:", result.get("ok"), result.get("error", ""))
          PYEOF
